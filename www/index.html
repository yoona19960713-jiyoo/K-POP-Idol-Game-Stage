<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>打歌準備室</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#24182D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEEBF3;--paper:#FBFAFD;--ink:#24182D;--soft:#6A5C74;--line:#D9D2E2;--well:#E4DFEB;
  --pos:#2E7D5B;--neg:#B23A48;--warn:#9A6A10;--focus:#5B3FA0;--gold:#E8B730;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141018;--paper:#1D1824;--ink:#EEE8F4;--soft:#A99BB5;--line:#352C40;--well:#29222F;--pos:#5CC497;--neg:#F07A88;--warn:#E3B04B;--focus:#B49BF0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141018;--paper:#1D1824;--ink:#EEE8F4;--soft:#A99BB5;--line:#352C40;--well:#29222F;--pos:#5CC497;--neg:#F07A88;--warn:#E3B04B;--focus:#B49BF0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:Archivo,"Noto Sans TC",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:flex-end;justify-content:space-between}
.show{font:800 clamp(28px,5.5vw,48px)/1.05 Archivo,"Noto Sans TC",sans-serif;margin:0}
.sub{color:var(--soft);font-size:14px;margin-top:4px}
.week{display:flex;gap:4px;margin:14px 0 4px;flex-wrap:wrap}
.day{flex:1 1 0;min-width:44px;text-align:center;border-radius:10px;padding:6px 2px;background:var(--well);font-size:12px;color:var(--soft);border:1px solid transparent}
.day b{display:block;font:700 13px/1.3 Archivo,"Noto Sans TC",sans-serif;color:var(--ink)}
.day.now{border-color:var(--ink);background:var(--paper)}
.day.win{background:var(--gold);color:#3A2A00}.day.win b{color:#3A2A00}
.day.lose{opacity:.75}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;margin-top:14px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:900px){.side{position:static}}
h2{font-size:17px;margin:0 0 4px}h3{font-size:15px;margin:0 0 6px}
.hint{font-size:13px;color:var(--soft);margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--well);border-radius:999px;padding:7px 14px;cursor:pointer}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.field{border-top:1px solid var(--line);padding:14px 0 4px}
.field:first-of-type{border-top:0;padding-top:4px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:transparent;border-radius:10px;padding:7px 12px;cursor:pointer;text-align:left;max-width:260px}
.opt small{display:block;color:var(--soft);font-size:12px;line-height:1.4}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--well);box-shadow:inset 0 0 0 1px var(--ink)}
.opt:disabled{opacity:.4;cursor:not-allowed}
.mrow{display:grid;grid-template-columns:40px 1fr minmax(0,240px);gap:10px;align-items:center;padding:6px 0}
@media (max-width:560px){.mrow{grid-template-columns:40px 1fr}.mrow select,.mrow .rest{grid-column:1/-1}}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;text-shadow:0 0 2px rgba(0,0,0,.4);border:0;padding:0;cursor:pointer;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--paper);color:var(--ink);max-width:min(440px,92vw);padding:18px}
dialog::backdrop{background:rgba(20,10,30,.45)}
.inp{background:var(--well);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.mrow select{width:100%;background:var(--well);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:0 8px;border:1px solid currentColor;margin-left:4px}
.tag.neg{color:var(--neg)}.tag.warn{color:var(--warn)}.tag.pos{color:var(--pos)}
.stat{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.stat:first-of-type{border-top:0}
.bars{display:grid;grid-template-columns:40px 1fr 30px;gap:2px 8px;font-size:12px;color:var(--soft);align-items:center}
.bar{height:6px;border-radius:3px;background:var(--well);overflow:hidden}.bar i{display:block;height:100%;border-radius:3px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.kv b{font-family:Archivo,"Noto Sans TC",sans-serif}
.result{margin-top:16px}
.verdict{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.grade{font:800 64px/1 Archivo,sans-serif;width:84px;text-align:center}
.crown{font:800 22px/1.2 Archivo,"Noto Sans TC",sans-serif}
.crown.win{color:var(--warn)}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:10px}
th,td{padding:5px 6px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td.us{font-weight:700}
.log{margin:10px 0 0;padding:0;list-style:none;font-size:14px}
.log li{padding:6px 0 6px 12px;border-left:3px solid var(--line);margin:4px 0}
.log li.say{border-color:var(--focus)}
.log li.bad{border-color:var(--neg)}.log li.good{border-color:var(--pos)}
.foot{color:var(--soft);font-size:12px;margin-top:18px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1 class="show" id="showName"></h1><div class="sub" id="showSub"></div></div>
    <label class="sub">年份 <select id="year" style="background:var(--well);border:1px solid var(--line);border-radius:8px;padding:4px 8px"></select></label>
  </div>
  <div class="week" id="week" aria-label="這一週的打歌行程"></div>

  <div class="grid">
    <main>
      <div class="panel" id="prep">
        <div class="row" style="justify-content:space-between"><h2>打歌準備單</h2><button class="btn" id="reuse">沿用上一場</button></div>
        <p class="hint">每一項都由你決定,按「確認上台」後時間才會往前走。</p>

        <div class="field"><h3>造型</h3>
          <div class="row" style="margin-bottom:6px"><span class="hint" style="margin:0">一鍵全員套用團體服:</span><select id="groupPick" style="background:var(--well);border:1px solid var(--line);border-radius:8px;padding:4px 8px"></select></div>
          <div id="looks"></div></div>

        <div class="field"><h3>舞台版本</h3><div class="opts" id="ver"></div></div>
        <div class="field"><h3>收音方式</h3><div class="opts" id="mic"></div></div>
        <div class="field"><h3>主推直拍</h3><div class="opts" id="cam"></div></div>
        <div class="field" id="endWrap"><h3>Ending 鏡頭</h3><div class="opts" id="end"></div></div>

        <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn pri" id="go">確認上台</button></div>
      </div>

      <div class="panel result hidden" id="result"></div>
      <div class="panel" style="margin-top:16px">
        <h2>資料來源與同步</h2>
        <p class="hint" id="srcInfo"></p>
        <div class="row"><button class="btn" id="reload">重新讀取歌曲與造型</button></div>
        <h3 style="margin:16px 0 4px">雲端同步</h3>
        <p class="hint">跟衣帽間工坊、歌曲企劃室用同一個 Firebase 設定和帳號。登入後會讀取歌曲企劃室的主打歌和衣帽間的造型,頭像也三支程式共用。</p>
        <textarea id="syCfgIn" rows="3" class="inp" style="width:100%;font-size:13px" placeholder="貼上 firebaseConfig 整段"></textarea>
        <div class="row" style="margin-top:6px"><button class="btn" id="sySaveCfg">儲存設定</button><span class="hint" id="syCfgInfo" style="margin:0"></span></div>
        <div id="syIn"><div class="row" style="margin-top:8px"><input class="inp" type="text" id="syEmail" placeholder="Email" autocomplete="username" style="flex:1;min-width:160px"><input class="inp" type="password" id="syPw" placeholder="密碼" autocomplete="current-password" style="flex:1;min-width:130px"></div>
          <div class="row" style="margin-top:6px"><button class="btn pri" id="sySignIn">登入</button></div></div>
        <div id="syOut" class="hidden"><div class="row" style="margin-top:8px"><span class="hint" id="syWho" style="flex:1;margin:0"></span><button class="btn pri" id="syNow">立即同步</button><button class="btn" id="sySignOut">登出</button></div></div>
        <p class="hint" id="syStatus" style="margin:8px 0 0"></p>
        <h3 style="margin:16px 0 4px">備份與版本</h3>
        <div class="row"><button class="btn" id="bkOut">匯出備份</button><button class="btn" id="bkIn">匯入備份</button><button class="btn" id="updCheck">檢查更新</button></div>
        <p class="hint" id="verNote" style="margin:8px 0 0"></p>
      </div>
      <p class="foot">還沒登入同步時,歌曲和造型會用示範資料。點任何一個成員頭像都可以換成她的照片。</p>
    </main>

    <aside class="side">
      <div class="panel"><h3>這次回歸</h3><div class="kv" id="promo"></div>
        <div class="row" style="margin-top:12px"><button class="btn" id="restart">重新開始宣傳期</button></div></div>
      <div class="panel"><h3>成員狀態</h3><div id="status"></div></div>
    </aside>
  </div>
</div>

<dialog id="updDlg"><h2 style="margin:0 0 6px">有新版本</h2><p id="updInfo" style="margin:0"></p><p class="hint" id="updNotes" style="white-space:pre-wrap"></p><p class="hint" id="updHow"></p>
  <div class="row" style="justify-content:flex-end"><button class="btn" id="updLater">稍後</button><button class="btn" id="updBk">先匯出備份</button><button class="btn pri" id="updGo"></button></div></dialog>
<script src="version.js"></script>
<script>
"use strict";
/* ---------- 示範資料 ---------- */
const M=[
  {id:"ys",n:"藝瑟",c:"#7B4FBF",vocal:72,dance:55,expr:70},
  {id:"tr",n:"泰梨",c:"#C8102E",vocal:45,dance:65,expr:72},
  {id:"hy",n:"日和",c:"#C9A35E",vocal:45,dance:78,expr:68},
  {id:"he",n:"夏恩",c:"#E9746A",vocal:62,dance:55,expr:65},
  {id:"hr",n:"河嵐",c:"#7FAF2C",vocal:50,dance:60,expr:52},
];
const byId=id=>M.find(m=>m.id===id);
let SONG={name:"Crimson Lullaby",score:82,killer:"hy",center:"he",target:{sweet:2,pure:0,lively:1,fancy:-2,retro:0},highLines:{ys:2,he:1,hr:1}};
const AX=["sweet","pure","lively","fancy","retro"];
let LOOKS=[
  {id:"L1",n:"緋紅童話",g:1,occ:"打歌舞台",r:"SR",a:{sweet:2,pure:0,lively:1,fancy:-2,retro:-1}},
  {id:"L2",n:"黑曜騎士",g:1,occ:"打歌舞台",r:"SSR",a:{sweet:3,pure:1,lively:1,fancy:-3,retro:1}},
  {id:"L3",n:"粉紅泡泡",g:1,occ:"打歌舞台",r:"R",a:{sweet:-3,pure:-2,lively:-2,fancy:-1,retro:0}},
  {id:"L4",n:"白玫瑰告別",g:1,occ:"打歌舞台",r:"SSR",a:{sweet:1,pure:-1,lively:2,fancy:-3,retro:-1}},
  {id:"L5",n:"街頭機能",g:1,occ:"日常",r:"N",a:{sweet:1,pure:0,lively:-1,fancy:2,retro:1}},
  {id:"L6",n:"紫夜禮服",own:"ys",occ:"頒獎典禮",r:"SSR",a:{sweet:2,pure:1,lively:3,fancy:-3,retro:0}},
  {id:"L7",n:"芭蕾紗裙",own:"hy",occ:"打歌舞台",r:"SR",a:{sweet:0,pure:-2,lively:3,fancy:-2,retro:-2}},
  {id:"L8",n:"運動短版",own:"hr",occ:"演唱會",r:"R",a:{sweet:0,pure:1,lively:-3,fancy:1,retro:1}},
];
const SHOWS=[
  {d:"週二",n:"SHOW PULSE",w:{digital:.35,sales:.1,views:.2,social:.15,stage:.2}},
  {d:"週三",n:"CHAMPION LIVE",w:{digital:.35,sales:.15,views:.15,social:.1,stage:.25}},
  {d:"週四",n:"COUNTDOWN M",w:{digital:.45,sales:.15,views:.15,social:.15,stage:.1}},
  {d:"週五",n:"MUSIC VAULT",w:{digital:.6,sales:.1,views:.1,social:.1,stage:.1}},
  {d:"週六",n:"CORE STAGE",w:{digital:.5,sales:.1,views:.1,social:.1,stage:.2}},
  {d:"週日",n:"STAR GAYO",w:{digital:.55,sales:.1,views:.15,social:.1,stage:.1}},
];
const RIVAL={n:"LUMIÈRE",note:"三代頂流女團,同週回歸"};
const VERS={orig:{n:"原版",s:"最穩定",st:0,fresh:0},special:{n:"特別編舞版",s:"新鮮感高,體力消耗大",st:6,fresh:8},long:{n:"加長舞蹈段",s:"日和發揮空間,體力消耗大",st:5,fresh:5},goodbye:{n:"告別舞台",s:"只限最後一週,情緒拉滿",st:3,fresh:12}};
const MICS={live:{n:"全開麥",s:"評價最高,最怕失誤"},half:{n:"部分墊音",s:"穩定與評價折衷"},lip:{n:"整首對嘴",s:"最穩,但被抓到就是輿論"}};
const RAR={N:0,R:2,SR:4,SSR:6};
const OCC={"打歌舞台":1,"演唱會":.85,"頒獎典禮":.85,"寫真":.7,"綜藝":.65,"機場":.55,"日常":.55,"練習":.5};

/* ---------- 狀態 ---------- */
const KEY="stagePrep.v1";
function fresh(){return {year:2016,idx:0,wins:0,log:[],uses:{},camCount:{},prev:null,
  m:Object.fromEntries(M.map(m=>[m.id,{stamina:90,throat:90,mood:70,pop:20,cond:""}])),plan:null,last:null}}
let S; try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.m) S=fresh();
const save=(bump=true)=>{if(bump){S.updatedAt=Date.now();sySchedule()} try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const TOTAL=24;
const weekOf=i=>Math.floor(i/6)+1, showOf=i=>SHOWS[i%6];
let seed=0; const rnd=()=>{seed=(seed*1103515245+12345)%2147483648;return seed/2147483648};

function defaultPlan(){return {looks:Object.fromEntries(M.map(m=>[m.id,(LOOKS.find(l=>l.g)||LOOKS[0])?.id||""])),ver:"orig",mic:"half",cam:SONG.killer,end:SONG.center,rest:{}}}
function ensurePlan(){ if(!S.plan) S.plan=S.prev?JSON.parse(JSON.stringify(S.prev)):defaultPlan();
  for(const m of M){const ok=LOOKS.filter(l=>l.g||l.own===m.id); if(!ok.some(l=>l.id===S.plan.looks[m.id])) S.plan.looks[m.id]=ok[0]?.id||""}
  if(S.plan.ver==="goodbye"&&weekOf(S.idx)<4) S.plan.ver="orig"; if(+S.year<2017) S.plan.end=""; }

/* ---------- 計算 ---------- */
function lookScore(L,mid){
  const dist=Math.sqrt(AX.reduce((x,k)=>x+(L.a[k]-SONG.target[k])**2,0));
  let s=100-dist*9; s=s*(OCC[L.occ]??.6)+RAR[L.r];
  const used=(S.uses[mid+":"+L.id]||0); s-=Math.max(0,used-2)*5;
  return {s:Math.max(0,Math.min(100,s)),used,dist};
}
function outfitScore(p){
  const on=M.filter(m=>!p.rest[m.id]&&LOOKS.find(l=>l.id===p.looks[m.id])); const parts=on.map(m=>({m,L:LOOKS.find(l=>l.id===p.looks[m.id]),...lookScore(LOOKS.find(l=>l.id===p.looks[m.id]),m.id)}));
  if(!parts.length) return {s:0,parts};
  let s=parts.reduce((x,o)=>x+o.s,0)/Math.max(1,parts.length);
  const ids=new Set(parts.map(o=>o.L.id)); if(ids.size===1&&parts[0].L.g) s+=5; else if(ids.size>2) s-=4;
  return {s:Math.max(0,Math.min(100,s)),parts};
}
function perform(){
  const p=S.plan, i=S.idx, wk=weekOf(i), sh=showOf(i); seed=(i+1)*7919+(+S.year);
  const on=M.filter(m=>!p.rest[m.id]); const log=[]; const V=VERS[p.ver];
  const O=outfitScore(p);
  // 舞台品質
  let stage=SONG.score*.55+O.s*.25+V.fresh;
  let mistakes=[], caught=false;
  for(const m of on){const st=S.m[m.id]; const tired=(100-st.stamina)/100;
    stage-=tired*6; if(st.cond==="sick") stage-=3; if(st.cond==="hurt") stage-=4;
    if(p.mic==="live"){const hl=SONG.highLines[m.id]||0; const pf=hl*(.06+(100-st.throat)/250)+(st.cond==="sick"?.2:0);
      if(rnd()<pf){mistakes.push(m);stage-=7}}
    if(p.mic==="half"&&st.cond==="sick"&&rnd()<.15){mistakes.push(m);stage-=4}}
  if(p.mic==="live") stage+=10-mistakes.length*2; if(p.mic==="half") stage+=4;
  if(p.mic==="lip"&&rnd()<.12) caught=true;
  if(on.length<5) stage-=8;
  stage=Math.max(20,Math.min(100,stage));
  const grade=stage>=90?"S":stage>=80?"A":stage>=68?"B":stage>=55?"C":"D";
  // 直拍與熱度
  const camM=byId(p.cam); const camOn=!p.rest[p.cam];
  let views=Math.round((40+S.m[p.cam].pop*1.5+(p.cam===SONG.killer?30:0)+stage*.6)*(.8+rnd()*.5)*(camOn?1:.2));
  if(+S.year>=2016) views=Math.round(views*1.6);
  let social=stage*.5+views*.2+(caught?-25:0)+(V===VERS.goodbye?10:0);
  const endViral=p.end&&!p.rest[p.end]&&rnd()<.18+(S.m[p.end].mood/500);
  if(endViral) social+=12;
  if(+S.year>=2020) social+=5;
  // 一位計分
  const decay=[0,.92,1,.9,.78][wk];
  const us={digital:SONG.score*decay,sales:70,views:Math.min(100,views/3.4),social:Math.min(100,social*.95),stage};
  const rv={digital:(79+rnd()*12)*([0,1,.96,.88,.78][wk]),sales:82,views:58+rnd()*24,social:52+rnd()*28,stage:70+rnd()*14};
  const pts=o=>Math.round(Object.entries(sh.w).reduce((x,[k,w])=>x+o[k]*w,0)*100);
  const up=pts(us), rp=pts(rv), win=up>rp;
  // 劇情片段(內容庫的樣子)
  const say=(id,t)=>log.push(["say",`<b style="color:${byId(id).c}">${byId(id).n}</b>:「${t}」`]);
  if(p.ver==="special") say("tr","新編舞的第二段我想再對一次,一次就好。");
  if(p.ver==="goodbye") say("ys","最後一週了……大家,今天把它當成最後一次跳。");
  if(p.mic==="live") say("he","全開麥嗎?好,我會守住副歌。");
  if(p.mic==="lip"&&!caught) say("hr","今天放錄音……其實有點不甘心。");
  for(const m of M) if(p.rest[m.id]) log.push(["",`${m.n}今天在休息室休息,四人上台。`]);
  for(const m of on) if(S.m[m.id].cond==="hurt") say(m.id,"腳踝我會自己注意,不要因為我改隊形。");
  mistakes.forEach(m=>log.push(["bad",`${m.n}在高音段破音了,網路上開始出現剪輯。`]));

}

    else if(localAt>remoteAt||!d){const at=localAt||Date.now();S.updatedAt=at;save(false);await syPatch("stage/state",{json:{stringValue:JSON.stringify(S)},updatedAt:{integerValue:String(at)}})}
    const a=await syGet("shared/avatars"); const aAt=a?+a.fields.updatedAt.integerValue:0;
    if(aAt>(AV.at||0)){AV={img:JSON.parse(a.fields.json.stringValue),at:aAt};saveAV()} else if((AV.at||0)>aAt) await syPushAvatars();
    await loadLinked(); render();
    syLast=Date.now(); syStatus("已同步 "+new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"})); if(manual) toast("同步完成");
  }catch(e){syStatus(syMsg(e),true); if(manual) toast(syMsg(e))}
  finally{syBusy=false; if(syAgain){syAgain=false;sySchedule()}}
}
function syRender(){const c=syCfg(),a=syAuth(); $("#syCfgInfo").textContent=c?`已設定專案:${c.projectId}`:"";
  $("#syIn").classList.toggle("hidden",!!a); $("#syOut").classList.toggle("hidden",!a); $("#syWho").textContent=a?`已登入:${a.email}`:""}
$("#sySaveCfg").onclick=()=>{const t=$("#syCfgIn").value; const k=t.match(/apiKey["'\s:]+["']([^"']+)["']/),p=t.match(/projectId["'\s:]+["']([^"']+)["']/);
  if(!k||!p){toast("找不到 apiKey 或 projectId,請貼上整段 firebaseConfig");return}
  localStorage.setItem(SY_CFG,JSON.stringify({apiKey:k[1],projectId:p[1]})); $("#syCfgIn").value=""; syRender(); toast("Firebase 設定已儲存")};
$("#sySignIn").onclick=async()=>{const c=syCfg(); if(!c){toast("先貼上 Firebase 設定");return} syStatus("登入中…");
  try{const j=await syJSON(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${encodeURIComponent(c.apiKey)}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("#syEmail").value.trim(),password:$("#syPw").value,returnSecureToken:true})});
    localStorage.setItem(SY_AUTH,JSON.stringify({uid:j.localId,email:j.email,refreshToken:j.refreshToken})); syTok={id:j.idToken,exp:Date.now()+(+j.expiresIn-60)*1000};
    $("#syPw").value=""; syRender(); syncNow(true)}catch(e){syStatus(syMsg(e),true)}};
$("#sySignOut").onclick=async()=>{localStorage.removeItem(SY_AUTH);syTok=null;syRender();syStatus("");await loadLinked();render();toast("已登出,本機內容保留")};
$("#syNow").onclick=()=>syncNow(true);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&Date.now()-syLast>2*60*1000) syncNow(false)});

/* ---------- 版本更新 ---------- */
$("#verNote").textContent="版本 "+(window.APP_VERSION||"開發版");
const isNative=!!window.Capacitor?.isNativePlatform?.();
let updLatest=null,updLastCheck=0,updDismissed=0;
async function checkUpdate(manual){updLastCheck=Date.now();
  if(!window.PAGES_URL||typeof window.APP_BUILD!=="number"){ if(manual) toast("開發版不檢查更新"); return }
  try{const r=await fetch(window.PAGES_URL+"version.json?t="+Date.now(),{cache:"no-store"}); if(!r.ok) throw 0; const v=await r.json();
    if(+v.build>window.APP_BUILD){updLatest=v; if(manual||updDismissed!==+v.build) showUpdate(v)} else if(manual) toast("已經是最新版本")}catch(e){ if(manual) toast("檢查更新失敗,請確認網路") }}
function showUpdate(v){$("#updInfo").textContent=`目前 ${window.APP_VERSION},最新 ${v.version}。`;$("#updNotes").textContent=v.notes?("更新內容:"+String(v.notes).trim().slice(0,400)):"";
  $("#updHow").textContent=isNative?"按下後會用瀏覽器下載新的安裝檔,下載完點開安裝,資料會保留。":"按下後會重新載入成新版,資料會保留。";$("#updGo").textContent=isNative?"下載新版":"立即更新";const d=$("#updDlg");if(!d.open) d.showModal()}
$("#updLater").onclick=()=>{updDismissed=+(updLatest?.build||0);$("#updDlg").close()};
$("#updBk").onclick=()=>$("#bkOut").click();
$("#updGo").onclick=async()=>{if(isNative){const url=window.PAGES_URL+"KPOP-Stage.apk?v="+(updLatest?.build||Date.now());const w=window.open(url,"_blank");if(!w) location.href=url;return}
  $("#updGo").disabled=true;$("#updGo").textContent="更新中…";try{await Promise.all(["index.html","version.js","manifest.webmanifest"].map(u=>fetch(u,{cache:"reload"}).catch(()=>{})))}catch(e){}location.reload()};
$("#updCheck").onclick=()=>checkUpdate(true);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&Date.now()-updLastCheck>30*60*1000) checkUpdate(false)});
setTimeout(()=>checkUpdate(false),3000);

$("#srcInfo").textContent=srcText; syRender();
render(); if(S.last&&S.idx>=TOTAL) renderResult(S.last);
syncNow(false);
</script>
</body>
</html>
